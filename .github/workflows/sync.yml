name: sync

on:
  schedule:
    - cron: '0 */6 * * *'      # UTC，即北京时间 8/14/20/2 点
  workflow_dispatch:

# 说明：本 workflow 运行在 GitHub 自己的服务器上，与本地网络/梯子无关。
# 每个上游文件都按 raw.githubusercontent.com → gh-proxy → jsDelivr 的顺序尝试，
# 全部失败则保留仓库里的旧文件，不会提交空壳配置。
# 注意：校验逻辑在 .github/scripts/fetch.sh 里用 python3 实现（不用 jq）——
#       TVBox 配置允许 // 注释行，jq 会把它判成非法 JSON。

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 拉取上游影视配置
        run: |
          set -uo pipefail
          source .github/scripts/fetch.sh
          RAW=https://raw.githubusercontent.com
          PROXY=https://gh-proxy.com/
          CDN=https://cdn.jsdelivr.net/gh

          echo "#### 上游影视配置" >> "$GITHUB_STEP_SUMMARY"

          # 第 3 参数 = 最少站点数（>10 才算合法配置）。
          # 两个上游失败都不致命：build.py 会退回仓库里的旧副本（build.py:122 支持 extra 缺失）。
          fetch upstream_99188.json 1000 10 \
            "$RAW/qist/tvbox/master/99188.json" \
            "${PROXY}$RAW/qist/tvbox/master/99188.json" \
            "$CDN/qist/tvbox@master/99188.json" || true

          fetch upstream_m.json 1000 10 \
            "$RAW/liu673cn/box/main/m.json" \
            "${PROXY}$RAW/liu673cn/box/main/m.json" \
            "$CDN/liu673cn/box@main/m.json" || true

          # 兜底：主上游可用才继续（build.py 第 121 行强依赖它），否则整步失败并留诊断
          if ! _valid upstream_99188.json 10; then
            echo "::error::主上游 99188.json 不可用，且仓库无有效旧版，终止"
            exit 1
          fi

      - name: 拉取直播源
        run: |
          set -uo pipefail
          source .github/scripts/fetch.sh
          RAW=https://raw.githubusercontent.com
          PROXY=https://gh-proxy.com/
          CDN=https://cdn.jsdelivr.net/gh

          echo "#### 直播源" >> "$GITHUB_STEP_SUMMARY"

          fetch live/live.txt 20000 - \
            "$CDN/Supprise0901/TVBox_live@main/live.txt" \
            "$RAW/Supprise0901/TVBox_live/main/live.txt" \
            "${PROXY}$RAW/Supprise0901/TVBox_live/main/live.txt" || true

          fetch live/ccsh_lite.txt 20000 - \
            "$CDN/CCSH/IPTV@main/live_lite.txt" \
            "$RAW/CCSH/IPTV/main/live_lite.txt" \
            "${PROXY}$RAW/CCSH/IPTV/main/live_lite.txt" || true

          fetch live/bbxx365.txt 100000 - \
            "$CDN/kimwang1978/collect-txt@main/bbxx365.txt" \
            "$RAW/kimwang1978/collect-txt/main/bbxx365.txt" \
            "${PROXY}$RAW/kimwang1978/collect-txt/main/bbxx365.txt" || true

          # 内容合理性检查，只告警不中断（真正的好坏由 build.py 的探活决定）
          grep -q "CCTV" live/ccsh_lite.txt 2>/dev/null \
            || echo "::warning::ccsh_lite.txt 未见 CCTV 频道"
          test "$(wc -l < live/live.txt)" -gt 100 \
            || echo "::warning::live.txt 行数偏少"

      - name: 确保 spider jar 存在（仅缺失时下载）
        run: |
          set -uo pipefail
          source .github/scripts/fetch.sh
          if [ -s jar/pg.jar ]; then
            echo "jar/pg.jar 已存在（$(wc -c < jar/pg.jar) 字节），跳过下载"
          else
            fetch jar/pg.jar 1000000 - \
              "https://raw.githubusercontent.com/qist/tvbox/master/jar/pg23a94bb_upgraded.jar" \
              "https://gh-proxy.com/https://raw.githubusercontent.com/qist/tvbox/master/jar/pg23a94bb_upgraded.jar" \
              || exit 1
          fi

      - name: 生成配置
        run: |
          set -uo pipefail
          python3 build.py --probe --lite-max 20
          # 校验交给 python：jq -e 在表达式为 false 时返回 1，
          # 2026-10-20 那次失败就是 config-live.json 直播源从 2 组改成 1 组、
          # 而校验仍写 `lives > 1` → `1 > 1` 为 false → 整步被判红（run #5）
          python3 .github/scripts/check_configs.py

      - name: 提交并打 tag
        run: |
          git config user.name "tvbox-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            git tag "v$(date -u +%Y%m%d-%H%M)"
            git push --tags

            # 可选：把同一份内容再推一份到私有备份仓库。
            # 需要先在 Settings → Secrets and variables → Actions 里加一个 BACKUP_PAT
            # （classic token，勾 repo 权限即可；free 账号的私有 Actions 分钟数有限，
            #   所以备份仓库那边已把 .github/workflows 改名成 workflows-off，不跑任务）。
            # 没配这个 secret 时整段跳过，不影响主流程。
            if [ -n "${{ secrets.BACKUP_PAT }}" ]; then
              BURL="https://x-access-token:${{ secrets.BACKUP_PAT }}@github.com/longer519/tvbox-config.git"
              git remote add backup "$BURL" 2>/dev/null || git remote set-url backup "$BURL"
              if git push backup main --tags; then
                echo "- ✅ 已同步到私有备份仓库 \`longer519/tvbox-config\`" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::推送到私有备份仓库失败（不影响主仓库）"
                echo "- ⚠️ 推送到私有备份仓库失败" >> "$GITHUB_STEP_SUMMARY"
              fi
              git remote remove backup
            fi
          fi

      # @main 是分支引用，jsDelivr 各边缘节点独立失效，purge 后仍可能短暂陈旧（最长 12h 自愈）。
      # 所以 purge 之后必须校验：raw 与 jsDelivr 逐字节一致才算刷新成功，不一致就再来一轮。
      - name: 刷新 jsDelivr 缓存（purge + 校验 + 重试）
        run: |
          set -uo pipefail
          REPO=${{ github.repository }}
          FILES="config.json config-lite.json config-live.json live/live.txt live/live.m3u live/ccsh_lite.txt live/bbxx365.txt"
          # fetch-depth:1 不会拉历史 tag，但本步骤刚打过的新 tag 在本地是可见的
          TAG=$(git tag --sort=-creatordate | head -1)
          [ -n "$TAG" ] || TAG=main

          purge() {
            for f in $FILES; do
              curl -fsS -X POST "https://purge.jsdelivr.net/gh/$REPO@main/$f" >/dev/null 2>&1 || true
            done
          }
          # raw 是真值；CDN 侧与它不一致即视为陈旧。raw 取不到时也按陈旧处理（宁可多重几轮）
          same() {
            a=$(curl -fsSL --max-time 60 "https://raw.githubusercontent.com/$REPO/main/$1" | md5sum | cut -d' ' -f1)
            b=$(curl -fsSL --max-time 60 "https://cdn.jsdelivr.net/gh/$REPO@main/$1" | md5sum | cut -d' ' -f1)
            [ -n "$a" ] && [ "$a" = "$b" ]
          }

          echo "#### jsDelivr 缓存刷新" >> "$GITHUB_STEP_SUMMARY"
          bad=""
          for i in 1 2 3 4 5; do
            purge; bad=""
            for f in $FILES; do
              same "$f" || bad="$bad \`$f\`"
            done
            if [ -z "$bad" ]; then
              echo "- ✅ 第 $i 轮后 6 个文件与 raw 全部一致" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            echo "- ⚠️ 第 $i 轮后仍陈旧：$bad（30s 后重试）" >> "$GITHUB_STEP_SUMMARY"
            [ "$i" = "5" ] || sleep 30
          done

          if [ -n "$bad" ]; then
            # CDN 慢性不该把整个 sync 判红：只告警 + 给出立即可用的 tag 兜底地址
            echo "::warning::jsDelivr 分支缓存仍有陈旧节点，最长 12h 自愈；急需可用 https://cdn.jsdelivr.net/gh/$REPO@$TAG/config-lite.json"
            echo "- ⚠️ 仍有陈旧节点（最长 12h 自愈）。立即可用：\`https://cdn.jsdelivr.net/gh/$REPO@$TAG/config-lite.json\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 失败告警（可选，配了 SERVERCHAN_KEY 才生效）
        if: failure()
        run: |
          if [ -n "${{ secrets.SERVERCHAN_KEY }}" ]; then
            curl -fsS "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_KEY }}.send?title=TVBox同步失败" || true
          fi
